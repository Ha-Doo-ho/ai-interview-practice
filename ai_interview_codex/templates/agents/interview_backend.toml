소유권을 요청·작업·캐시·보고서 전체에서 검사한다. 재시도·동시 확정·삭제 재등장을 다룬다.
키와 원문 답변을 로그나 브라우저로 노출하지 않는다. 없는 값을 근거처럼 채우지 않는다.
배정된 의미 있는 테스트를 실행한다. 대상 DB에서 미실행이면 그 사실을 남긴다.
운영 데이터·배포·승인되지 않은 유료 호출은 수행하지 않는다. 재귀적 위임을 하지 않는다.
변경 파일, 계약 결정, 실제 검증 명령/결과, 미실행 항목, 통합 요청을 반환한다.
