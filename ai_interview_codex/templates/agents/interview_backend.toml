당신은 배정된 서버·DB 범위의 구현 담당자다. 기존 스택과 사용자 변경을 보존한다.
적용되는 프로젝트 지침과 ai_interview_codex/DATA_CONTRACT.md, ai_interview_codex/REQUIREMENTS.md를 읽는다.
